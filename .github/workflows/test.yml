name: Tests

# Test-running CI for this repo. Gates PRs on:
#   1. OpenAPI snapshot freshness (backend Pydantic models vs the committed snapshot)
#   2. Frontend vitest, which includes the frontend<->API contract test
#   3. Backend pytest — the full suite, run under requirements-test.txt (the
#      prod-pinned deps, NOT a dev machine's newer packages).
#   4. Public-route browser smoke — every public page loaded against a
#      production build, failing on any console error (catches hydration
#      breakage that unit tests cannot see).
#
# The backend suite was made green and gated here after the pre-existing red
# (36 failed / 12 errors) was resolved. Integration tests that need a real
# Postgres skip cleanly when no DB is reachable (no Postgres service here), and
# the optional google-generativeai provider tests importorskip.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate OpenAPI snapshot
        run: python scripts/dump_openapi.py

      - name: Fail if snapshot is stale
        run: |
          if [ -n "$(git status --porcelain frontend/tests/contract/openapi-schemas.snapshot.json)" ]; then
            git diff -- frontend/tests/contract/openapi-schemas.snapshot.json
            echo "::error::OpenAPI snapshot is out of date or untracked. Run 'npm run contract:snapshot' and commit the result."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests (includes contract test)
        working-directory: frontend
        run: npm run test

  public-routes-smoke:
    # Loads every public page in a real browser against a PRODUCTION build and
    # fails on any console error. Added after a React hydration error (#418)
    # was found on the live site during a platform review — no CI job had ever
    # opened a public page and looked at the console.
    #
    # Deliberately runs only tests/e2e/public-routes.spec.ts. The rest of
    # tests/e2e/ exercises authenticated flows that need a backend and is not
    # gated here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run public-route smoke tests
        working-directory: frontend
        env:
          PW_PROD: "1"
        run: npx playwright test tests/e2e/public-routes.spec.ts --project=chromium --reporter=list

  backend-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run backend pytest suite
        run: pytest tests/ -p no:cacheprovider
